name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Pack NuGet packages
        run: |
          dotnet pack src/EncDotNet.Iso8211/EncDotNet.Iso8211.csproj --no-build --configuration Release --output nupkgs
          dotnet pack src/EncDotNet.S57/EncDotNet.S57.csproj --no-build --configuration Release --output nupkgs
          dotnet pack src/EncDotNet.Noaa/EncDotNet.Noaa.csproj --no-build --configuration Release --output nupkgs

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg

  publish:
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: ChartViewer-osx-arm64
          - os: windows-latest
            rid: win-x64
            artifact: ChartViewer-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: ChartViewer-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ChartViewer
        run: dotnet publish src/EncDotNet.ChartViewer/EncDotNet.ChartViewer.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Import signing certificate
        if: matrix.rid == 'osx-arm64' && secrets.APPLE_DEVELOPER_CERTIFICATE_P12 != ''
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign macOS binary
        if: matrix.rid == 'osx-arm64' && secrets.APPLE_DEVELOPER_CERTIFICATE_P12 != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            src/EncDotNet.ChartViewer/bin/Release/net10.0/osx-arm64/publish/EncDotNet.ChartViewer

      - name: Notarize macOS binary
        if: matrix.rid == 'osx-arm64' && secrets.APPLE_DEVELOPER_CERTIFICATE_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent \
            src/EncDotNet.ChartViewer/bin/Release/net10.0/osx-arm64/publish/EncDotNet.ChartViewer \
            ChartViewer.zip
          xcrun notarytool submit ChartViewer.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src/EncDotNet.ChartViewer/bin/Release/net10.0/${{ matrix.rid }}/publish/
